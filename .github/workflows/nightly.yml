# Opens PRs to update the generated reference pages every day at 12:00 UTC.

name: Nightly

on:
  schedule:
      - cron:  '0 12 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  docgen:
    name: Generate Reference Docs
    if: github.repository_owner == 'withastro'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Default options for running with latest Astro code
          - SOURCE_BRANCH: main
            TARGET_BRANCH: main
            LABEL: patch-release,ci
            PR_BRANCH: ci/docgen
            PR_TITLE: 'ci: update reference docs'
          # Custom options for running with Astro v7 code
          #- SOURCE_BRANCH: next
          #  TARGET_BRANCH: v7
          #  LABEL: major-release,ci
          #  PR_BRANCH: ci/docgen-beta
          #  PR_TITLE: '[BETA] ci: update reference docs'

    steps:
      - name: Check out the workflow's commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Find the base of the PR
        id: base
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_BRANCH: ${{ matrix.TARGET_BRANCH }}
          PR_BRANCH: ${{ matrix.PR_BRANCH }}
        with:
          github-token: ${{ secrets.FREDKBOT_GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const { prepareNightlyBase } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/nightly-base.ts`);
            return prepareNightlyBase({ github, context, targetBranch: process.env.TARGET_BRANCH, prBranch: process.env.PR_BRANCH });

      - name: Check out the base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.base.outputs.result }}
          persist-credentials: false

      - name: Install Tools & Dependencies
        uses: ./.github/actions/install

      - name: Run docgen script
        run: pnpm run docgen
        env:
          SOURCE_BRANCH: ${{ matrix.SOURCE_BRANCH }}

      - name: Create Pull Request
        id: createpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ${{ matrix.PR_BRANCH }}
          token: ${{ secrets.FREDKBOT_GITHUB_TOKEN }}
          add-paths: src/content/docs/en/reference/*.mdx
          commit-message: 'ci: update reference docs'
          title: ${{ matrix.PR_TITLE }}
          body: |
            This PR is auto-generated by a nightly GitHub action to update the reference docs from source code in withastro/astro.
          labels: ${{ matrix.LABEL }}
          base: ${{ steps.base.outputs.result }}
          # Closes the PR once its base has the changes.
          delete-branch: true

  error:
    name: Generate Error Reference Docs
    if: github.repository_owner == 'withastro'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Default options for running with latest Astro code
          - SOURCE_BRANCH: main
            TARGET_BRANCH: main
            LABEL: patch-release,ci
            PR_BRANCH: ci/docgen-errors
            PR_TITLE: 'ci: update error reference docs'
          # Custom options for running with Astro v7 code
          #- SOURCE_BRANCH: next
          #  TARGET_BRANCH: v7
          #  LABEL: major-release,ci
          #  PR_BRANCH: ci/docgen-errors-beta
          #  PR_TITLE: '[BETA] ci: update error reference docs'

    steps:
      - name: Check out the workflow's commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Find the base of the PR
        id: base
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_BRANCH: ${{ matrix.TARGET_BRANCH }}
          PR_BRANCH: ${{ matrix.PR_BRANCH }}
        with:
          github-token: ${{ secrets.FREDKBOT_GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const { prepareNightlyBase } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/nightly-base.ts`);
            return prepareNightlyBase({ github, context, targetBranch: process.env.TARGET_BRANCH, prBranch: process.env.PR_BRANCH });

      - name: Check out the base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.base.outputs.result }}
          persist-credentials: false

      - name: Install Tools & Dependencies
        uses: ./.github/actions/install

      - name: Run docgen script
        run: pnpm run docgen:errors
        env:
          SOURCE_BRANCH: ${{ matrix.SOURCE_BRANCH }}

      - name: Create Pull Request
        id: createpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ${{ matrix.PR_BRANCH }}
          token: ${{ secrets.FREDKBOT_GITHUB_TOKEN }}
          add-paths: src/content/docs/en/reference/*.mdx
          commit-message: 'ci: update error reference docs'
          title: ${{ matrix.PR_TITLE }}
          body: |
            This PR is auto-generated by a nightly GitHub action to update the error reference docs from source code in withastro/astro.
          labels: ${{ matrix.LABEL }}
          base: ${{ steps.base.outputs.result }}
          # Closes the PR once its base has the changes.
          delete-branch: true
