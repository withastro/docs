# Starts `release-assistant.yml` when a PR gets the accepted label. On a PR from a fork, this run
# gets no secrets, so the release assistant runs in that other workflow.

# `TRIGGER_WORKFLOW_NAME` in `scripts/release-assistant/config.ts` must match this name.
name: Release assistant trigger

on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  trigger:
    # `TRIGGER_CHECK_NAME` in `scripts/release-assistant/config.ts` must match this name.
    name: Trigger the release assistant
    if: github.event.label.name == 'accepted'
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - run: echo "Triggering the release assistant"
