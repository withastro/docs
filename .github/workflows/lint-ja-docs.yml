# Runs textlint on Japanese pages.

name: Lint Japanese Documentation

on:
  push:
    branches: [main]
    paths:
      - 'src/content/docs/ja/**'
      - '.textlintrc.ja.json'
  pull_request:
    paths:
      - 'src/content/docs/ja/**'
      - '.textlintrc.ja.json'

permissions: {}

# Automatically cancel in-progress actions on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  textlint:
    name: Run textlint on Japanese documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Tools & Dependencies
        uses: ./.github/actions/install

      - name: Run textlint
        run: |
          pnpm run lint:ja --format github || {
            textlint_exit_code=$?
            echo "To fix these issues locally, run: pnpm run lint:ja"
            exit "$textlint_exit_code"
          }
