# Routes docs PRs labeled as accepted to the umbrella PR of their release.
# Run it manually to refresh the open umbrella PRs, for example after the
# release PR of `withastro/astro` changed.
# `MODE` sets which PRs it acts on: see `scripts/lib/release-queue/modes.ts`.

name: Release queue

on:
  # Needs a token that can comment on fork PRs. Never checks out the PR code.
  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [labeled]
  workflow_dispatch:

# Runs wait in a queue and execute one at a time, as joins update the same
# umbrella PR. The docs only show `queue` at the workflow level: runs for
# other labels are queued too.
concurrency:
  group: release-queue
  queue: max

permissions: {}

jobs:
  route:
    name: Route to release umbrella
    if: ${{ github.repository_owner == 'withastro' && (github.event_name == 'workflow_dispatch' || github.event.label.name == 'accepted') }}
    runs-on: ubuntu-latest
    # The job takes seconds. A hung run would block every run queued behind it.
    timeout-minutes: 5
    permissions:
      checks: read # Reads the checks of the PR.
      contents: read
      pull-requests: write # Comments on PRs, and reviews umbrella PRs.
      statuses: read # Reads the commit statuses of the PR.
    steps:
      # The script always comes from `main`, whatever the base branch of the PR.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts

      # The script has no dependencies: Node.js is enough, no `pnpm install`.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Route the PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Writes as the bot account outside a dry run: its merges trigger CI
          # on the umbrella PR. Also passed in dry run: going live only changes
          # MODE.
          BOT_TOKEN: ${{ secrets.FREDKBOT_GITHUB_TOKEN }}
          MODE: dry-run
        run: node --experimental-transform-types ./scripts/release-queue.ts
